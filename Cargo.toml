[package]
name = "bad_kvm_switch"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
ddc = "0.2"
ddc-hi = "0.4"
directories = "6.0.0"
futures-lite = "2.6.1"
libc = "0.2.186"
libloading = "0.9.0"
nusb = "0.2.4"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ddc-i2c = { version = "0.2.2", features = ["with-linux", "with-linux-enumerate"] }
i2c-linux = "0.1.2"
